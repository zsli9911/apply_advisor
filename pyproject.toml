[project]
name = "apply-advisor"
version = "0.1.0"
description = "Agentic RAG advisor for European / UK / Canada study-abroad applications"
requires-python = ">=3.9"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
